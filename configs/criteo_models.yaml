# Criteo STEP 5 model settings. configs/models.yaml (STEP 4) is not modified.
# Values below are copied from STEP 4 unchanged; only the data-specific entries differ.
#
# Binary outcome (conversion) review:
# - Outcome models stay RandomForestRegressor: regressing a 0/1 outcome estimates E[Y|X] = P(Y=1|X),
#   so T-Learner (mu1 - mu0) and X-Learner pseudo-effects (in [-1, 1]) remain valid.
# - CausalForestDML keeps discrete_outcome=False with a regressor model_y (official API: model_y must be
#   a regressor unless discrete_outcome=True). Residualising Y with E[Y|X] is unchanged for 0/1 Y.
# - discrete_treatment=True with DummyClassifier(prior) as model_t: randomized assignment, so the
#   propensity is the fold's treated share (~0.85); cv=5 uses StratifiedKFold on T (econml default).

seed: 42                 # model random_state for every estimator

base_learner:
  n_estimators: 200
  min_samples_leaf: 5
  max_features: 1.0
  n_jobs: 1

x_learner:
  propensity: null       # null -> treated share of the training sample (randomized design, ~0.85)

causal_forest:
  n_estimators: 1000
  min_samples_leaf: 5
  max_features: 1.0
  honest: true
  cv: 5
  propensity_model: constant
  n_jobs: 1

prediction:
  batch_size: 200000           # rows per predict call on the validation set
  subset_size: 50000           # fixed validation subset predicted first (timing / memory check)
  subset_seed: 42
  max_full_predict_minutes: 120   # skip full validation prediction if the subset-based estimate exceeds this
